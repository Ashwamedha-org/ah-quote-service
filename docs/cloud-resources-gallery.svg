<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="gbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#0f1a2e"/></linearGradient>
    <filter id="gglow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" rx="18" fill="url(#gbg)"/>
  <text x="30" y="50" fill="#e2e8f0" font-size="24" font-weight="700">Cloud Resource Gallery — each resource, animated</text>

  <!-- ===== Row 1 ===== -->
  <!-- AKS -->
  <g transform="translate(20,80)">
    <rect width="370" height="195" rx="14" fill="#0f261f" stroke="#2dd4bf"/>
    <text x="18" y="30" fill="#5eead4" font-size="16" font-weight="700">Azure Kubernetes Service</text>
    <text x="18" y="50" fill="#9fded4" font-size="12">HPA scales stateless pods 2 → 20</text>
    <g>
      <rect x="20" y="70" width="46" height="46" rx="8" fill="#134e4a" stroke="#2dd4bf"/>
      <rect x="74" y="70" width="46" height="46" rx="8" fill="#134e4a" stroke="#2dd4bf"/>
      <rect x="128" y="70" width="46" height="46" rx="8" fill="#115e59" stroke="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.3;0.9;1" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="182" y="70" width="46" height="46" rx="8" fill="#115e59" stroke="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.4;0.9;1" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="20" y="124" width="46" height="46" rx="8" fill="#115e59" stroke="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.5;0.9;1" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="74" y="124" width="46" height="46" rx="8" fill="#115e59" stroke="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.6;0.9;1" dur="5s" repeatCount="indefinite"/></rect>
    </g>
    <text x="250" y="150" fill="#2dd4bf" font-size="34" font-weight="800">
      <animate attributeName="opacity" values="1" dur="5s" repeatCount="indefinite"/>20x</text>
    <text x="250" y="170" fill="#9fded4" font-size="12">replicas</text>
  </g>

  <!-- Azure Cache for Redis -->
  <g transform="translate(405,80)">
    <rect width="370" height="195" rx="14" fill="#2a1115" stroke="#f87171"/>
    <text x="18" y="30" fill="#fca5a5" font-size="16" font-weight="700">Azure Cache for Redis</text>
    <text x="18" y="50" fill="#f3b4b4" font-size="12">session store + read-aside cache</text>
    <text x="18" y="110" fill="#f87171" font-size="40" font-weight="800">hit
      <tspan id="h">
        <animate attributeName="opacity" values="1;1;1" dur="3s" repeatCount="indefinite"/> 92%</tspan></text>
    <circle cx="300" cy="100" r="28" fill="none" stroke="#7f1d1d" stroke-width="8"/>
    <circle cx="300" cy="100" r="28" fill="none" stroke="#f87171" stroke-width="8" stroke-dasharray="176" stroke-dashoffset="18" transform="rotate(-90 300 100)">
      <animate attributeName="stroke-dashoffset" values="176;14;176" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="18" y="150" fill="#f3b4b4" font-size="12">session:{quoteId} · TTL 30m</text>
    <rect x="18" y="160" width="330" height="10" rx="5" fill="#431014"/>
    <rect x="18" y="160" width="60" height="10" rx="5" fill="#f87171"><animate attributeName="width" values="30;320;30" dur="3s" repeatCount="indefinite"/></rect>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(790,80)">
    <rect width="370" height="195" rx="14" fill="#221533" stroke="#c084fc"/>
    <text x="18" y="30" fill="#d8b4fe" font-size="16" font-weight="700">Azure DB for PostgreSQL</text>
    <text x="18" y="50" fill="#cbb6e6" font-size="12">sharded primaries → read replicas</text>
    <rect x="30" y="70" width="90" height="40" rx="7" fill="#3b1d5e" stroke="#c084fc"/><text x="75" y="95" fill="#e9d5ff" font-size="12" text-anchor="middle">Shard 1</text>
    <rect x="250" y="70" width="90" height="40" rx="7" fill="#3b1d5e" stroke="#c084fc"/><text x="295" y="95" fill="#e9d5ff" font-size="12" text-anchor="middle">Shard 2</text>
    <rect x="30" y="140" width="90" height="36" rx="7" fill="#14532d" stroke="#22c55e"/><text x="75" y="163" fill="#bbf7d0" font-size="11" text-anchor="middle">replicas</text>
    <rect x="250" y="140" width="90" height="36" rx="7" fill="#14532d" stroke="#22c55e"/><text x="295" y="163" fill="#bbf7d0" font-size="11" text-anchor="middle">replicas</text>
    <circle r="5" fill="#4ade80" filter="url(#gglow)"><animate attributeName="cx" values="75;75" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="110;140" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle r="5" fill="#4ade80" filter="url(#gglow)"><animate attributeName="cx" values="295;295" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="110;140" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="150" y="130" fill="#64748b" font-size="11">WAL repl.</text>
  </g>

  <!-- ===== Row 2 ===== -->
  <!-- Entra ID -->
  <g transform="translate(20,290)">
    <rect width="370" height="195" rx="14" fill="#172554" stroke="#60a5fa"/>
    <text x="18" y="30" fill="#93c5fd" font-size="16" font-weight="700">Microsoft Entra ID</text>
    <text x="18" y="50" fill="#9fb3d1" font-size="12">groups → roles → JWT claim</text>
    <rect x="20" y="75" width="150" height="40" rx="8" fill="#1e3a8a" stroke="#60a5fa"/><text x="95" y="100" fill="#dbeafe" font-size="13" text-anchor="middle">grp-ah-users</text>
    <rect x="20" y="125" width="150" height="40" rx="8" fill="#1e3a8a" stroke="#60a5fa"/><text x="95" y="150" fill="#dbeafe" font-size="13" text-anchor="middle">grp-ah-admins</text>
    <rect x="200" y="100" width="150" height="40" rx="8" fill="#0f172a" stroke="#fbbf24"/>
    <text x="275" y="125" fill="#fde68a" font-size="14" font-weight="700" text-anchor="middle">role:
      <tspan><animate attributeName="opacity" values="1" dur="4s" repeatCount="indefinite"/></tspan></text>
    <text x="330" y="125" fill="#fde68a" font-size="14" font-weight="700" text-anchor="end">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="4s" repeatCount="indefinite"/>User</text>
    <text x="330" y="125" fill="#fca5a5" font-size="14" font-weight="700" text-anchor="end">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.55;0.95;1" dur="4s" repeatCount="indefinite"/>Admin</text>
    <path d="M170 95 L200 118" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.5s" repeatCount="indefinite"/></path>
    <path d="M170 145 L200 122" stroke="#60a5fa" stroke-width="2" stroke-dasharray="5 5"><animate attributeName="stroke-dashoffset" values="20;0" dur="0.5s" repeatCount="indefinite"/></path>
  </g>

  <!-- API Management -->
  <g transform="translate(405,290)">
    <rect width="370" height="195" rx="14" fill="#2a1026" stroke="#f472b6"/>
    <text x="18" y="30" fill="#f9a8d4" font-size="16" font-weight="700">API Management</text>
    <text x="18" y="50" fill="#f0a4c6" font-size="12">validate-jwt at the edge</text>
    <rect x="30" y="80" width="120" height="44" rx="8" fill="#3b0d2e" stroke="#f472b6"/><text x="90" y="107" fill="#fbcfe8" font-size="12" text-anchor="middle">JWT in</text>
    <rect x="220" y="80" width="120" height="44" rx="8" fill="#14532d" stroke="#22c55e"/><text x="280" y="107" fill="#bbf7d0" font-size="12" text-anchor="middle">to pod</text>
    <circle cx="185" cy="102" r="16" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
    <path d="M177 102 L183 108 L194 95" stroke="#22c55e" stroke-width="3" fill="none"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="2s" repeatCount="indefinite"/></path>
    <circle r="6" fill="#f472b6" filter="url(#gglow)"><animate attributeName="cx" values="90;185;280" keyTimes="0;0.5;1" dur="2s" repeatCount="indefinite"/><animate attributeName="cy" values="102;102;102" dur="2s" repeatCount="indefinite"/></circle>
    <text x="30" y="160" fill="#f0a4c6" font-size="12">Admin token → /admin · User token → 403 on /admin</text>
  </g>

  <!-- Front Door + WAF -->
  <g transform="translate(790,290)">
    <rect width="370" height="195" rx="14" fill="#1a1333" stroke="#a78bfa"/>
    <text x="18" y="30" fill="#c4b5fd" font-size="16" font-weight="700">Front Door + WAF</text>
    <text x="18" y="50" fill="#b7a8e0" font-size="12">blocks bad traffic, routes good</text>
    <path d="M185 70 L230 85 L230 125 Q185 160 140 125 L140 85 Z" fill="#2e2152" stroke="#a78bfa" stroke-width="2"/>
    <text x="185" y="115" fill="#c4b5fd" font-size="12" text-anchor="middle">WAF</text>
    <!-- good packet passes -->
    <circle r="6" fill="#22c55e" filter="url(#gglow)"><animate attributeName="cx" values="30;185;340" keyTimes="0;0.5;1" dur="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="110;110;110" dur="2.5s" repeatCount="indefinite"/></circle>
    <!-- bad packet blocked -->
    <circle r="6" fill="#ef4444" filter="url(#gglow)"><animate attributeName="cx" values="30;150;150;30" keyTimes="0;0.4;0.6;1" dur="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="150;140;140;150" dur="2.5s" repeatCount="indefinite"/></circle>
    <text x="30" y="178" fill="#b7a8e0" font-size="11">green = allowed · red = blocked at WAF</text>
  </g>

  <!-- ===== Row 3 ===== -->
  <!-- Key Vault -->
  <g transform="translate(20,500)">
    <rect width="370" height="195" rx="14" fill="#2a2410" stroke="#fbbf24"/>
    <text x="18" y="30" fill="#fde68a" font-size="16" font-weight="700">Key Vault</text>
    <text x="18" y="50" fill="#f5d98a" font-size="12">secrets pulled via Managed Identity</text>
    <circle cx="90" cy="120" r="22" fill="#422006" stroke="#fbbf24" stroke-width="2"/>
    <text x="90" y="127" fill="#fde68a" font-size="20" text-anchor="middle">🔑</text>
    <rect x="240" y="90" width="110" height="30" rx="7" fill="#134e4a" stroke="#2dd4bf"/><text x="295" y="110" fill="#ccfbf1" font-size="11" text-anchor="middle">service pod</text>
    <path d="M112 120 L240 105" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="24;0" dur="0.6s" repeatCount="indefinite"/></path>
    <circle r="5" fill="#fde68a" filter="url(#gglow)"><animate attributeName="cx" values="112;240" dur="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="120;105" dur="1.5s" repeatCount="indefinite"/></circle>
    <text x="18" y="170" fill="#f5d98a" font-size="12">no secrets in code · no secrets in Git</text>
  </g>

  <!-- Container Registry -->
  <g transform="translate(405,500)">
    <rect width="370" height="195" rx="14" fill="#0c2233" stroke="#38bdf8"/>
    <text x="18" y="30" fill="#7dd3fc" font-size="16" font-weight="700">Container Registry (ACR)</text>
    <text x="18" y="50" fill="#9cd8f7" font-size="12">images deployed to AKS</text>
    <rect x="30" y="90" width="90" height="50" rx="8" fill="#0e3a52" stroke="#38bdf8"/><text x="75" y="120" fill="#bae6fd" font-size="12" text-anchor="middle">image</text>
    <rect x="250" y="90" width="90" height="50" rx="8" fill="#134e4a" stroke="#2dd4bf"/><text x="295" y="120" fill="#ccfbf1" font-size="12" text-anchor="middle">AKS</text>
    <path d="M120 115 L250 115" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="24;0" dur="0.6s" repeatCount="indefinite"/></path>
    <rect width="18" height="14" rx="3" fill="#7dd3fc" filter="url(#gglow)"><animate attributeName="x" values="120;232" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="108;108" dur="1.8s" repeatCount="indefinite"/></rect>
    <text x="18" y="170" fill="#9cd8f7" font-size="12">CI builds → push → pull on deploy</text>
  </g>

  <!-- Azure Monitor -->
  <g transform="translate(790,500)">
    <rect width="370" height="195" rx="14" fill="#0e2a20" stroke="#34d399"/>
    <text x="18" y="30" fill="#6ee7b7" font-size="16" font-weight="700">Azure Monitor</text>
    <text x="18" y="50" fill="#9ae6c4" font-size="12">App Insights · Log Analytics (live)</text>
    <g fill="#34d399">
      <rect x="30" y="140" width="28" height="20"><animate attributeName="height" values="20;80;35;60;20" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="140;80;125;100;140" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="70" y="140" width="28" height="40"><animate attributeName="height" values="40;90;30;70;40" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="120;70;130;90;120" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="110" y="140" width="28" height="30"><animate attributeName="height" values="30;60;85;45;30" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="130;100;75;115;130" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="150" y="140" width="28" height="55"><animate attributeName="height" values="55;75;40;95;55" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="105;85;120;65;105" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="190" y="140" width="28" height="35"><animate attributeName="height" values="35;100;55;80;35" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="125;60;105;80;125" dur="3s" repeatCount="indefinite"/></rect>
    </g>
    <text x="250" y="150" fill="#6ee7b7" font-size="13">rps · p95 · errors</text>
  </g>
</svg>
